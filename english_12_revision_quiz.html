        // App States
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let viewMode = 'single'; // 'single' | 'list'
        let appMode = 'practice'; // 'practice' | 'test'
        let filteredQuestions = [...fullQuizData];
        let timerInterval = null;
        let timeRemaining = 45 * 60; // 45 minutes in seconds
        let isSubmitted = false;

        window.onload = function() {
            renderQuestionNav();
            renderQuiz();
            startTimer();
        };

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (appMode === 'test') {
                    timeRemaining--;
                    if (timeRemaining <= 0) {
                        timeRemaining = 0;
                        clearInterval(timerInterval);
                        alert("Hết giờ làm bài! Hệ thống sẽ tự động nộp bài.");
                        submitQuiz();
                    }
                } else {
                    timeRemaining++; // Count up in practice mode
                }
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
            const secs = String(timeRemaining % 60).padStart(2, '0');
            document.getElementById('time-display').innerText = `${mins}:${secs}`;
        }

        function switchAppMode(mode) {
            if (isSubmitted) {
                alert("Bạn đã nộp bài. Vui lòng bấm 'Làm lại từ đầu' để bắt đầu chế độ mới.");
                return;
            }
            appMode = mode;
            document.getElementById('mode-text').innerText = mode === 'practice' ? 'Chế độ: Luyện tập' : 'Chế độ: Thi thử (45 phút)';
            
            // Buttons UI
            if (mode === 'practice') {
                document.getElementById('btn-mode-practice').className = 'flex-1 py-1.5 px-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-sm transition';
                document.getElementById('btn-mode-test').className = 'flex-1 py-1.5 px-2 text-xs font-semibold rounded-lg text-slate-600 hover:bg-slate-200 transition';
                timeRemaining = 0;
            } else {
                document.getElementById('btn-mode-test').className = 'flex-1 py-1.5 px-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-sm transition';
                document.getElementById('btn-mode-practice').className = 'flex-1 py-1.5 px-2 text-xs font-semibold rounded-lg text-slate-600 hover:bg-slate-200 transition';
                timeRemaining = 45 * 60;
            }
            startTimer();
            renderQuiz();
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('single-view-btn').className = mode === 'single'
                ? 'py-1.5 text-xs font-medium rounded-lg border bg-indigo-50 text-indigo-700 border-indigo-200 transition flex items-center justify-center gap-1'
                : 'py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-600 border-slate-200 hover:bg-slate-50 transition flex items-center justify-center gap-1';
            
            document.getElementById('list-view-btn').className = mode === 'list'
                ? 'py-1.5 text-xs font-medium rounded-lg border bg-indigo-50 text-indigo-700 border-indigo-200 transition flex items-center justify-center gap-1'
                : 'py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-600 border-slate-200 hover:bg-slate-50 transition flex items-center justify-center gap-1';

            document.getElementById('single-nav').style.display = mode === 'single' ? 'flex' : 'none';
            renderQuiz();
        }

        function filterSection(sec) {
            if (sec === 'all') filteredQuestions = [...fullQuizData];
            else filteredQuestions = fullQuizData.filter(q => q.section === sec);
            
            currentQuestionIndex = 0;
            renderQuestionNav();
            renderQuiz();
        }

        function renderQuestionNav() {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';

            filteredQuestions.forEach((q, idx) => {
                const btn = document.createElement('button');
                const isAnswered = userAnswers[q.id] !== undefined;

                let cls = "h-8 text-xs font-bold rounded-lg border transition flex items-center justify-center ";

                if (isSubmitted || (appMode === 'practice' && isAnswered)) {
                    if (userAnswers[q.id] === q.answer) {
                        cls += "bg-emerald-500 text-white border-emerald-600";
                    } else if (isAnswered) {
                        cls += "bg-rose-500 text-white border-rose-600";
                    } else {
                        cls += "bg-slate-100 text-slate-400 border-slate-200";
                    }
                } else if (isAnswered) {
                    cls += "bg-indigo-600 text-white border-indigo-600";
                } else {
                    cls += "bg-white text-slate-700 border-slate-200 hover:bg-slate-100";
                }

                if (viewMode === 'single' && idx === currentQuestionIndex) {
                    cls += " ring-2 ring-indigo-500 ring-offset-1";
                }

                btn.className = cls;
                btn.innerText = q.id;
                btn.onclick = () => {
                    currentQuestionIndex = idx;
                    if (viewMode === 'list') {
                        document.getElementById(`q-card-${q.id}`)?.scrollIntoView({ behavior: 'smooth' });
                    } else {
                        renderQuiz();
                    }
                };
                grid.appendChild(btn);
            });

            document.getElementById('progress-text').innerText = `${Object.keys(userAnswers).length}/${fullQuizData.length}`;
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            const passageCard = document.getElementById('passage-card');
            container.innerHTML = '';

            if (filteredQuestions.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400">Không tìm thấy câu hỏi phù hợp.</div>`;
                passageCard.classList.add('hidden');
                return;
            }

            if (viewMode === 'single') {
                const q = filteredQuestions[currentQuestionIndex];
                renderPassage(q);
                container.appendChild(createQuestionCard(q, currentQuestionIndex));

                document.getElementById('current-q-indicator').innerText = `Câu ${currentQuestionIndex + 1} / ${filteredQuestions.length}`;
                document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
                document.getElementById('next-btn').disabled = currentQuestionIndex === filteredQuestions.length - 1;
                document.getElementById('prev-btn').style.opacity = currentQuestionIndex === 0 ? '0.4' : '1';
                document.getElementById('next-btn').style.opacity = currentQuestionIndex === filteredQuestions.length - 1 ? '0.4' : '1';
            } else {
                passageCard.classList.add('hidden');
                filteredQuestions.forEach((q, idx) => {
                    container.appendChild(createQuestionCard(q, idx, true));
                });
            }

            renderQuestionNav();
        }

        function renderPassage(q) {
            const passageCard = document.getElementById('passage-card');
            if (q.passage) {
                passageCard.classList.remove('hidden');
                document.getElementById('passage-title').innerText = q.passageTitle || "Nội dung tham chiếu";
                document.getElementById('passage-content').innerHTML = q.passage;
            } else {
                passageCard.classList.add('hidden');
            }
        }

        function createQuestionCard(q, idx, showInlinePassage = false) {
            const card = document.createElement('div');
            card.id = `q-card-${q.id}`;
            card.className = "bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 transition";

            let html = '';

            if (showInlinePassage && q.passage) {
                html += `
                    <div class="mb-4 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 leading-relaxed">
                        <span class="font-bold text-indigo-600 block mb-1">${q.passageTitle}</span>
                        ${q.passage}
                    </div>
                `;
            }

            html += `
                <div class="flex items-center justify-between mb-3">
                    <span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 font-extrabold text-xs rounded-lg">
                        ${q.qNum} (Câu ${q.id})
                    </span>
                </div>
                <h3 class="text-sm md:text-base font-bold text-slate-800 mb-4">${q.question}</h3>
                <div class="space-y-2">
            `;

            const isAnswered = userAnswers[q.id] !== undefined;
            const showFeedback = isSubmitted || (appMode === 'practice' && isAnswered);

            q.options.forEach((opt, optIdx) => {
                const isSelected = userAnswers[q.id] === optIdx;
                let optCls = "w-full text-left p-3 rounded-xl border text-xs md:text-sm font-medium transition flex items-center justify-between ";

                if (showFeedback) {
                    if (optIdx === q.answer) {
                        optCls += "bg-emerald-50 border-emerald-500 text-emerald-800 font-bold";
                    } else if (isSelected) {
                        optCls += "bg-rose-50 border-rose-500 text-rose-800";
                    } else {
                        optCls += "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                    }
                } else {
                    if (isSelected) {
                        optCls += "bg-indigo-50 border-indigo-600 text-indigo-900 font-bold shadow-sm";
                    } else {
                        optCls += "bg-white border-slate-200 text-slate-700 hover:bg-slate-50";
                    }
                }

                html += `
                    <button onclick="selectOption(${q.id}, ${optIdx})" ${isSubmitted ? 'disabled' : ''} class="${optCls}">
                        <span>${opt}</span>
                        ${showFeedback && optIdx === q.answer ? '<i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>' : ''}
                        ${showFeedback && isSelected && optIdx !== q.answer ? '<i class="fa-solid fa-circle-xmark text-rose-600 text-base"></i>' : ''}
                    </button>
                `;
            });

            html += `</div>`;

            if (showFeedback) {
                html += `
                    <div class="mt-4 p-3 bg-amber-50/80 border border-amber-200 rounded-xl text-xs text-amber-900 leading-relaxed">
                        <strong class="font-bold flex items-center gap-1 text-amber-800 mb-1">
                            <i class="fa-solid fa-lightbulb"></i> Giải thích:
                        </strong>
                        ${q.explain}
                    </div>
                `;
            }

            card.innerHTML = html;
            return card;
        }

        function selectOption(qId, optIdx) {
            if (isSubmitted) return;
            userAnswers[qId] = optIdx;
            renderQuiz();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuiz();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < filteredQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuiz();
            }
        }

        function submitQuiz() {
            if (isSubmitted) return;

            const answeredCount = Object.keys(userAnswers).length;
            if (answeredCount < fullQuizData.length) {
                if (!confirm(`Bạn mới trả lời ${answeredCount}/${fullQuizData.length} câu. Bạn vẫn muốn nộp bài?`)) {
                    return;
                }
            }

            clearInterval(timerInterval);
            isSubmitted = true;

            let correctCount = 0;
            fullQuizData.forEach(q => {
                if (userAnswers[q.id] === q.answer) correctCount++;
            });

            const grade = ((correctCount / fullQuizData.length) * 10).toFixed(1);

            document.getElementById('res-score').innerText = `${correctCount}/${fullQuizData.length}`;
            document.getElementById('res-grade').innerText = grade;

            let timeText = "";
            if (appMode === 'test') {
                const usedSecs = (45 * 60) - timeRemaining;
                const mins = String(Math.floor(usedSecs / 60)).padStart(2, '0');
                const secs = String(usedSecs % 60).padStart(2, '0');
                timeText = `${mins}:${secs}`;
            } else {
                const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
                const secs = String(timeRemaining % 60).padStart(2, '0');
                timeText = `${mins}:${secs}`;
            }
            document.getElementById('res-time').innerText = timeText;

            const feedbackEl = document.getElementById('res-feedback');
            if (grade >= 8.0) feedbackEl.innerText = "🎉 Xuất sắc! Bạn đã nắm rất vững đề cương giữa kỳ I.";
            else if (grade >= 5.0) feedbackEl.innerText = "👍 Tốt! Hãy ôn lại các câu chưa đúng để đạt điểm cao hơn.";
            else feedbackEl.innerText = "💪 Cố gắng lên! Hãy xem kỹ lời giải chi tiết bên dưới để ôn tập lại.";

            document.getElementById('result-box').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            renderQuiz();
        }

        function resetQuiz() {
            if (confirm("Xác nhận làm lại bài từ đầu?")) {
                userAnswers = {};
                isSubmitted = false;
                timeRemaining = appMode === 'test' ? 45 * 60 : 0;
                currentQuestionIndex = 0;
                document.getElementById('result-box').classList.add('hidden');
                startTimer();
                renderQuiz();
            }
        }
    </script>
</body>
</html>
